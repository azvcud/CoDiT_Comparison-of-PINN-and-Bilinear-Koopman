[tool.poetry]
name = "codit-comparison-of-pinn-and-bilinear-koopman"
version = "0.1.0"
description = "NMPC Controller with Koopman + PINN Models for Quadruple Tank System"
authors = ["azvcud <azvanegasc@udistrital.edu.co>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.11"

numpy = "1.26.4"
scipy = "1.11.4"
pandas = "2.0.3"

scikit-learn = "1.3.2"
joblib = "1.5.3"

matplotlib = "3.7.3"
seaborn = "0.13.2"

SALib = "1.5.1"
casadi = "3.7.2"

ipython = "8.39.0"
ipykernel = "7.2.0"
jupyter_client = "8.8.0"
jupyter_core = "5.9.1"

requests = "2.28.1"
psutil = "7.2.2"

torch = { version = "1.13.1", source = "pytorch" }
torchvision = { version = "0.14.1", source = "pytorch" }
torchaudio = { version = "0.13.1", source = "pytorch" }
scikit-optimize = "^0.10.2"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu117"
priority = "explicit"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
